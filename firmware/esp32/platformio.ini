[platformio]
; default_envs = seeed_xiao_esp32s3
; default_envs = waveshare_esp32s3_mini
; default_envs = alks_esp32s3_mini
default_envs = esp32-s3-devkitc-1
; default_envs = esp32s2_generic

; Older types are currently not supported because of missing JTAG interface
; that causes that the devices cannot be configured over serial connection!
;  default_envs = upesy_wroom
;  default_envs = esp32dev


[env]
platform = espressif32
framework = espidf
board_build.partitions = huge_app.csv
debug_init_break = tbreak setup
upload_protocol = esptool
upload_speed = 115200
monitor_speed = 115200
build_flags =
   -DCONFIG_SPIRAM_CACHE_WORKAROUND
   -DBOARD_HAS_PSRAM
   -mfix-esp32-psram-cache-issue
   -mfix-esp32-psram-cache-strategy=memw   
   -D ${sysenv.BUILD_FLAGS}
   -DCORE_DEBUG_LEVEL=3
extra_scripts = post:post_build.py


[env:seeed_xiao_esp32s3]
extends = env
board = seeed_xiao_esp32s3
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB   
board_build.flash_mode = dio
board_build.psram_type = opi
debug_tool = esp-builtin
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_flags = 
   -DSEEED_XIAO_S3
   ${env.build_flags}
board_build.cmake_extra_args =
   -DSDKCONFIG_DEFAULTS="sdkconfig.common;sdkconfig.board.seed_xiao_esp32s3"


[env:waveshare_esp32s3_mini]
extends = env
board = adafruit_qtpy_esp32s2
board_build.mcu = esp32s3
board_build.flash_mode = dio
board_build.psram_type = qio
board_upload.flash_size = 4MB
debug_tool = esp-builtin
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_flags = 
   -DESP32_S3_ZERO
   ${env.build_flags}
board_build.cmake_extra_args =
   -DSDKCONFIG_DEFAULTS="sdkconfig.common;sdkconfig.board.waveshare_esp32s3_mini"


[env:alks_esp32s3_mini]
extends = env
board = adafruit_qtpy_esp32s2
board_build.mcu = esp32s3
board_build.flash_mode = dio
board_build.psram_type = qio
board_upload.flash_size = 4MB
debug_tool = esp-builtin
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_flags = 
   -DESP32_S3_ALKS_MINI
   ${env.build_flags}
board_build.cmake_extra_args =
   -DSDKCONFIG_DEFAULTS="sdkconfig.common;sdkconfig.board.alks_esp32s3_mini"


[env:esp32-s3-devkitc-1]
extends = env
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_upload.flash_size = 8MB
debug_tool = esp-builtin
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_flags = 
   -DESP32_S3_WROOM_1
   ${env.build_flags}
board_build.cmake_extra_args =
 -DSDKCONFIG_DEFAULTS="sdkconfig.common;sdkconfig.board.esp32s3_devkit_c1"


[env:esp32s2_generic]
extends = env
board = esp32-s2-saola-1
board_build.mcu = esp32s2
board_upload.flash_size = 4MB
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_flags = 
   -DESP32_S2_MINI
   ${env.build_flags}
board_build.cmake_extra_args =
   -DSDKCONFIG_DEFAULTS="sdkconfig.common;sdkconfig.board.esp32s2_generic"


