<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rase Configuration Manager</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #062433, #0d4968, #062433);
            color: #effdb1;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: linear-gradient(135deg, #0e3063, #0b2041, #0e3063);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        header {
            background: rgba(5, 26, 66, 0.8);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #ff6b6b;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #02cc5d;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .config-container {
            padding: 30px;
        }

        .section {
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(0, 16, 53, 0.6);
            border-radius: 10px;
            border-left: 4px solid #02cc5d;
        }

        .section-title {
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: #02cc5d;
            display: flex;
            align-items: center;
        }

        .section-title i {
            margin-right: 10px;
        }

        .form-group {
            margin-bottom: 15px;
            padding: 8px;
            background: linear-gradient(0deg, #0e3063, #0b2041, #0e3063);
            color: #a0beff;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            border: none;
            background: rgba(1, 14, 128, 0.33);
            color: rgb(241, 242, 245);
            font-size: 1rem;
        }

        input:focus,
        select:focus {
            outline: 2px solid #02cc5d;
            background: rgba(1, 42, 119, 0.9);
        }

        .password-field {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #02cc5d;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 25px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(to right, #ff6b6b, #02cc5d);
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }

        button:active {
            transform: translateY(1px);
        }

        #save-btn {
            background: linear-gradient(to right, #06d6a0, #118ab2);
        }

        .status {
            text-align: center;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            display: none;
        }

        .success {
            background: rgba(6, 214, 160, 0.2);
            border: 1px solid #06d6a0;
            color: #06d6a0;
            display: block;
        }

        .error {
            background: rgba(239, 71, 111, 0.2);
            border: 1px solid #ef476f;
            color: #ef476f;
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid rgba(13, 3, 59, 0.3);
            border-radius: 50%;
            border-top: 4px solid #02cc5d;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            opacity: 0.7;
            border-top: 1px solid rgba(182, 6, 6, 0.1);
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
            }

            .config-container {
                padding: 15px;
            }

            h1 {
                font-size: 2rem;
            }

            .btn-container {
                flex-direction: column;
                align-items: center;
            }

            button {
                width: 80%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>RASE Configuration Manager</h1>
            <p class="subtitle">Manage device settings and save changes to the server</p>
        </header>

        <div class="config-container">
            <div class="section">
                <h2 class="section-title">WiFi Settings</h2>
                <div class="form-group">
                    <label for="ssid">SSID</label>
                    <input type="text" id="ssid" name="ssid">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password">
                        <span class="toggle-password" id="toggle-password">👁️</span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="wifi_channel">WiFi Channel</label>
                    <!-- <input type="text" id="wifi_channel" name="wifi_channel"> -->
                    <select id="wifi_channel" name="wifi_channel">
                        <option value="1">Channel 1</option>
                        <option value="2">Channel 2</option>
                        <option value="3">Channel 3</option>
                        <option value="4">Channel 4</option>
                        <option value="5">Channel 5</option>
                        <option value="6">Channel 6</option>
                        <option value="7">Channel 7</option>
                        <option value="8">Channel 8</option>
                        <option value="9">Channel 9</option>
                        <option value="10">Channel 10</option>
                        <option value="11">Channel 11</option>
                    </select>
                </div>
            </div>

            <div class="section">
                <h2 class="section-title">MQTT Settings</h2>
                <div class="form-group">
                    <label for="mqtt_broker">MQTT Broker IP</label>
                    <input type="text" id="mqtt_broker" name="mqtt_broker">
                </div>
                <div class="form-group">
                    <label for="mqtt_username">MQTT Username</label>
                    <input type="text" id="mqtt_username" name="mqtt_username">
                </div>
                <div class="form-group">
                    <label for="mqtt_password">MQTT Password</label>
                    <div class="password-field">
                        <input type="password" id="mqtt_password" name="mqtt_password">
                        <span class="toggle-password" id="toggle-mqtt-password">👁️</span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="mqtt_enable">MQTT Enable</label>
                    <select id="mqtt_enable" name="mqtt_enable">
                        <option value="enabled">Enabled</option>
                        <option value="disabled">Disabled</option>
                    </select>
                </div>
            </div>

            <div class="section">
                <h2 class="section-title">Display Settings</h2>
                <div class="form-group">
                    <label for="display_layout">Display Layout</label>
                    <select id="display_layout" name="display_layout">
                        <option value="Value page">Value page</option>
                        <option value="Details page">Details page</option>
                        <option value="Info page">Info page</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="display_param">Display Parameter (0-255)</label>
                    <input type="number" id="display_param" name="display_param" min="0" max="255" value="0">
                </div>
                <div class="form-group">
                    <label for="display_rotation">Display Rotation</label>
                    <select id="display_rotation" name="display_rotation">
                        <option value="0°">0°</option>
                        <option value="180°">180°</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="display_timeout">Display Timeout</label>
                    <select id="display_timeout" name="display_timeout">
                        <option value="Never">Never</option>
                        <option value="10 s">10 s</option>
                        <option value="1 min">1 min</option>
                        <option value="5 min">5 min</option>
                        <option value="15 min">15 min</option>
                        <option value="30 min">30 min</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="display_contrast">Display Contrast</label>
                    <select id="display_contrast" name="display_contrast">
                        <option value="100%">100%</option>
                        <option value="80%">80%</option>
                        <option value="60%">60%</option>
                        <option value="50%">50%</option>
                        <option value="40%">40%</option>
                        <option value="30%">30%</option>
                        <option value="20%">20%</option>
                        <option value="10%">10%</option>
                    </select>
                </div>
            </div>

            <div class="section">
                <h2 class="section-title">Sensor Settings</h2>
                <div class="form-group">
                    <label for="sensor_type">Sensor Type</label>
                    <select id="sensor_type" name="sensor_type">
                        <option value="autoscan">autoscan</option>
                        <option value="Null">Null</option>
                        <option value="SHT2x">SHT2x</option>
                        <option value="SHT3x">SHT3x</option>
                        <option value="HTU21d">HTU21d</option>
                        <option value="ATHxx">ATHxx</option>
                        <option value="HDC1080">HDC1080</option>
                        <option value="BMx280">BMx280</option>
                    </select>
                </div>
            </div>

            <div class="section">
                <h2 class="section-title">LED Settings</h2>
                <div class="form-group">
                    <label for="led_intensity">LED Intensity</label>
                    <select id="led_intensity" name="led_intensity">
                        <option value="100%">100%</option>
                        <option value="75%">75%</option>
                        <option value="50%">50%</option>
                        <option value="25%">25%</option>
                        <option value="10%">10%</option>
                        <option value="1%">1%</option>
                    </select>
                </div>
            </div>

            <div class="btn-container">
                <button id="load-btn">Load Configuration</button>
                <button id="save-btn">Save Configuration</button>
                <!-- <button id="reset-btn">Reset Form</button> -->
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing request...</p>
            </div>

            <div class="status" id="status"></div>
        </div>

        <footer>
            <p>RASE Configuration Manager &copy; 2026</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const togglePassword = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('password');

            const toggleMqttPassword = document.getElementById('toggle-mqtt-password');
            const mqttPasswordInput = document.getElementById('mqtt_password');

            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.textContent = type === 'password' ? '👁️' : '🔒';
            });

            toggleMqttPassword.addEventListener('click', function () {
                const type = mqttPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                mqttPasswordInput.setAttribute('type', type);
                this.textContent = type === 'password' ? '👁️' : '🔒';
            });

            document.getElementById('load-btn').addEventListener('click', loadConfiguration);
            document.getElementById('save-btn').addEventListener('click', saveConfiguration);

            loadConfiguration();

            function loadConfiguration() {
                showLoading(true);
                const status = document.getElementById('status');

                setTimeout(() => {
                    try {
                        fetch('/api/config')
                            .then(response => response.json())
                            .then(data => populateForm(data))

                        status.textContent = 'Configuration loaded successfully!';
                        status.style.backgroundColor = '#4CAF50';
                        status.style.display = 'block';
                    } catch (error) {
                        status.textContent = 'Error loading configuration: ' + error.message;
                        status.style.backgroundColor = '#f44336';
                        status.style.display = 'block';
                    }

                    showLoading(false);
                }, 1000);
            }

            function saveConfiguration() {
                showLoading(true);
                const status = document.getElementById('status');

                const formData = {};
                const inputs = document.querySelectorAll('input, select');

                inputs.forEach(input => {
                    if (input.name) {
                        if (input.type === 'checkbox') {
                            formData[input.name] = input.checked;
                        } else {
                            formData[input.name] = input.value;
                        }
                    }
                });

                setTimeout(() => {
                    try {
                        fetch('/api/config', {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(formData)
                        })
                        .then(response => response.json())
                        .then(data => {
                            status.textContent = 'Configuration saved successfully!';
                            status.style.backgroundColor = '#4CAF50';
                            status.style.display = 'block';
                        });

                        status.textContent = 'Configuration saved successfully!';
                        status.style.backgroundColor = '#4CAF50';
                        status.style.display = 'block';
                    } catch (error) {
                        status.textContent = 'Error saving configuration: ' + error.message;
                        status.style.backgroundColor = '#f44336';
                        status.style.display = 'block';
                    }

                    showLoading(false);
                }, 1000);
            }

            function populateForm(data) {
                for (const key in data) {
                    const element = document.getElementById(key);
                    if (element) {
                        if (element.tagName === 'SELECT') {
                            element.value = data[key];
                        } else if (element.type === 'checkbox') {
                            element.checked = data[key];
                        } else {
                            element.value = data[key];
                        }
                    }
                }
            }

            function showLoading(show) {
                const loading = document.getElementById('loading');
                if (show) {
                    loading.style.display = 'block';
                } else {
                    loading.style.display = 'none';
                }
            }
        });
    </script>
</body>
</html>
