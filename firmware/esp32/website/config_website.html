<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASE Sensor Configuration</title>
    <style>
        body {
            background-color: #2c3e50; /* dark blue-ish background */
            color: #ecf0f1;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: none;
        }
        button {
            background-color: #16a085; /* teal-ish button */
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1abc9c;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>RASE Sensor Configuration</h1>

    <div id="config-form">
        <label for="ssid">SSID:</label>
        <input type="text" id="ssid" name="ssid"><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password"><br>

        <label for="wifi-channel">WiFi Channel:</label>
        <select id="wifi-channel" name="wifi_channel">
            <option value="1">1</option>
            <option value="6">6</option>
            <option value="11">11</option>
        </select><br>

        <label for="mqtt-broker">MQTT Broker IP:</label>
        <input type="text" id="mqtt-broker" name="mqtt_broker"><br>

        <label for="mqtt-username">MQTT Username:</label>
        <input type="text" id="mqtt-username" name="mqtt_username"><br>

        <label for="mqtt-password">MQTT Password:</label>
        <input type="password" id="mqtt-password" name="mqtt_password"><br>

        <label for="mqtt-enable">Enable MQTT:</label>
        <select id="mqtt-enable" name="mqtt_enable">
            <option value="enabled">Enabled</option>
            <option value="disabled">Disabled</option>
        </select><br>

        <label for="display-layout">Display Layout:</label>
        <select id="display-layout" name="display_layout">
            <option value="Value page">Value Page</option>
            <option value="Details page">Details Page</option>
            <option value="Info page">Info Page</option>
        </select><br>

        <label for="display-param">Display Parameter:</label>
        <input type="number" id="display-param" name="display_param" min="0" max="255"><br>

        <label for="display-rotation">Display Rotation:</label>
        <select id="display-rotation" name="display_rotation">
            <option value="0°">0°</option>
            <option value="180°">180°</option>
        </select><br>

        <label for="display-timeout">Display Timeout:</label>
        <select id="display-timeout" name="display_timeout">
            <option value="Never">Never</option>
            <option value="10 s">10 s</option>
            <option value="1 min">1 min</option>
            <option value="5 min">5 min</option>
            <option value="15 min">15 min</option>
            <option value="30 min">30 min</option>
        </select><br>

        <label for="display-contrast">Display Contrast:</label>
        <input type="number" id="display-contrast" name="display_contrast" min="1" max="100"><br>

        <label for="sensor-type">Sensor Type:</label>
        <select id="sensor-type" name="sensor_type">
            <option value="BMx280">BME280</option>
            <option value="autoscan">Auto Scan</option>
            <option value="Null">Null</option>
            <option value="SHT2x">SHT2x</option>
            <option value="SHT3x">SHT3x</option>
            <option value="HTU21d">HTU21D</option>
            <option value="ATHxx">ATH Sensor</option>
            <option value="HDC1080">HDC1080</option>
        </select><br>

        <label for="led-intensity">LED Intensity:</label>
        <input type="number" id="led-intensity" name="led_intensity" min="1" max="100"><br>

        <button onclick="fetchConfig()">Load Configuration</button>
        <button onclick="saveConfig()">Save Configuration</button>
    </div>

    <h2>Firmware Update</h2>
    <input type="file" id="firmware-file" accept=".bin">
    <button onclick="uploadFirmware()">Upload Firmware</button>
</div>

<script>
function fetchConfig() {
    fetch('/api/config')
        .then(response => response.json())
        .then(data => {
            document.getElementById('ssid').value = data.ssid;
            document.getElementById('password').value = '********'.repeat(data.password.length);
            document.getElementById('wifi-channel').value = data.wifi_channel;
            document.getElementById('mqtt-broker').value = data.mqtt_broker;
            document.getElementById('mqtt-username').value = data.mqtt_username;
            document.getElementById('mqtt-password').value = '********'.repeat(data.mqtt_password.length);
            document.getElementById('mqtt-enable').value = data.mqtt_enable;
            document.getElementById('display-layout').value = data.display_layout;
            document.getElementById('display-param').value = data.display_param;
            document.getElementById('display-rotation').value = data.display_rotation;
            document.getElementById('display-timeout').value = data.display_timeout;
            document.getElementById('display-contrast').value = data.display_contrast;
            document.getElementById('sensor-type').value = data.sensor_type.split(',')[0];
            document.getElementById('led-intensity').value = parseInt(data.led_intensity);
        })
        .catch(error => console.error('Error fetching config:', error));
}

function saveConfig() {
    const formData = new FormData(document.getElementById('config-form'));

    const data = {};
    for (const [key, value] of formData.entries()) {
        if (key === 'password') {
            data[key] = document.getElementById(key).type === 'password' ? value : '';
        } else if (key === 'sensor_type') {
            data[key] = `${value},${fetchConfigData('sensor_type').split(',').join(',')}`;
        } else {
            data[key] = value;
        }
    }

    fetch('/api/config', {
        method: 'PUT',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(() => alert('Configuration saved successfully!'))
    .catch(error => console.error('Error saving config:', error));
}

function uploadFirmware() {
    const fileInput = document.getElementById('firmware-file');
    if (fileInput.files.length === 0) {
        alert('Please select a firmware file.');
        return;
    }

    const file = fileInput.files[0];
    const formData = new FormData();
    formData.append('firmware', file);

    fetch('/update', {
        method: 'PUT',
        body: formData
    })
    .then(() => alert('Firmware upload successful!'))
    .catch(error => console.error('Error uploading firmware:', error));
}

function fetchConfigData(key) {
    return (async () => {
        const response = await fetch('/api/config');
        if (!response.ok) throw new Error('Network response was not ok.');
        const data = await response.json();
        return data[key];
    })();
}
</script>
</body>
</html>
