<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASE Firmware Uploader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .card-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title i {
            font-size: 1.8rem;
        }

        .upload-area {
            border: 3px dashed rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }

        .upload-area:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .upload-area i {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
        }

        .file-input {
            display: none;
        }

        .btn {
            background: linear-gradient(to right, #4A00E0, #8E2DE2);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
            margin: 10px 5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .device-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .info-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
        }

        .info-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .progress-container {
            margin-top: 20px;
            display: none;
        }

        .progress-bar {
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: linear-gradient(to right, #00b09b, #96c93d);
            width: 0%;
            transition: width 0.4s ease;
        }

        .status {
            margin-top: 15px;
            text-align: center;
            min-height: 24px;
        }

        .success {
            color: #96c93d;
        }

        .error {
            color: #ff6b6b;
        }

        .device-id {
            font-size: 1.8rem;
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            word-break: break-all;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: translateX(200%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            h1 {
                font-size: 2rem;
            }

            .card {
                padding: 15px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>RASE Firmware Uploader</h1>
            <p class="subtitle">Securely update firmware on your devices</p>
        </header>

        <div class="card">
            <h2 class="card-title">Device Information</h2>
            <div class="device-id" id="deviceId">Retrieving device ID...</div>

            <div class="device-info" id="deviceInfo">
                <!-- Device info will be populated here -->
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">Firmware Update</h2>
            <p>Select a firmware image file to upload:</p>

            <div class="upload-area" id="dropArea">
                <i>📁</i>
                <p>Drag & drop your firmware file here</p>
                <p>or</p>
                <button class="btn" id="browseBtn">Browse Files</button>
                <input type="file" id="fileInput" class="file-input" accept=".bin,.hex,.img">
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="status" id="status">Uploading firmware...</div>
            </div>

            <div class="actions">
                <button class="btn" id="uploadBtn" disabled>Upload Firmware</button>
                <button class="btn" id="refreshBtn">Refresh Device Info</button>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const dropArea = document.getElementById('dropArea');
            const fileInput = document.getElementById('fileInput');
            const browseBtn = document.getElementById('browseBtn');
            const uploadBtn = document.getElementById('uploadBtn');
            const refreshBtn = document.getElementById('refreshBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progress = document.getElementById('progress');
            const status = document.getElementById('status');
            const deviceId = document.getElementById('deviceId');
            const deviceInfo = document.getElementById('deviceInfo');
            const notification = document.getElementById('notification');

            let selectedFile = null;

            browseBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleFileSelect);
            uploadBtn.addEventListener('click', uploadFirmware);
            refreshBtn.addEventListener('click', fetchDeviceInfo);

            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, highlight, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, unhighlight, false);
            });

            function highlight() {
                dropArea.style.backgroundColor = 'rgba(255, 255, 255, 0.15)';
                dropArea.style.borderColor = 'rgba(255, 255, 255, 0.7)';
            }

            function unhighlight() {
                dropArea.style.backgroundColor = '';
                dropArea.style.borderColor = 'rgba(255, 255, 255, 0.3)';
            }

            dropArea.addEventListener('drop', handleDrop, false);

            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;
                if (files.length) {
                    handleFiles(files);
                }
            }

            function handleFileSelect(e) {
                const files = e.target.files;
                if (files.length) {
                    handleFiles(files);
                }
            }

            function handleFiles(files) {
                selectedFile = files[0];
                if (selectedFile.type !== 'application/octet-stream' && !selectedFile.name.endsWith('.bin')) {
                    showNotification('Please select a valid firmware file (.bin)', 'error');
                    return;
                }

                uploadBtn.disabled = false;
                status.textContent = `Selected: ${selectedFile.name} (${formatFileSize(selectedFile.size)})`;
            }

            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            function fetchDeviceInfo() {
                showNotification('Fetching device information...', 'info');
                fetch('/api/id', { method: 'GET' })
                    .then(response => response.json())
                    .then(data => {
                        displayDeviceInfo(data);
                        showNotification('Device information retrieved successfully', 'success');
                    })
                    .catch(error => {
                        console.error('Error fetching device info:', error);
                        showNotification('Failed to retrieve device information', 'error');
                    });
            }

            function displayDeviceInfo(data) {
                deviceId.textContent = data.identification;

                deviceInfo.innerHTML = '';

                Object.entries(data).forEach(([key, value]) => {
                    const item = document.createElement('div');
                    item.className = 'info-item';

                    const label = document.createElement('div');
                    label.className = 'info-label';
                    label.textContent = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());

                    const valueEl = document.createElement('div');
                    valueEl.className = 'info-value';
                    valueEl.textContent = value;

                    item.appendChild(label);
                    item.appendChild(valueEl);
                    deviceInfo.appendChild(item);
                });
            }

            function uploadFirmware() {
                if (!selectedFile) {
                    showNotification('Please select a firmware file first', 'error');
                    return;
                }

                progressContainer.style.display = 'block';
                status.textContent = 'Starting upload...';
                progress.style.width = '0%';

                const formData = new FormData();
                formData.append('firmware', selectedFile);
                
                fetch('/api/update', {
                    method: 'PUT',
                    body: formData
                })
                .then(response => {
                    if (response.ok) {
                        return response.text();
                    } else {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                })
                .then(data => {
                    status.textContent = 'Upload completed successfully';
                    showNotification('Firmware uploaded successfully', 'success');
                    progress.style.width = '100%';
                })
                .catch(error => {
                    console.error('Error uploading firmware:', error);
                    status.textContent = 'Upload failed';
                    showNotification('Firmware upload failed', 'error');
                    progress.style.width = '100%';
                });
            }

            function showNotification(message, type) {
                notification.textContent = message;
                notification.className = 'notification ' + type;

                setTimeout(() => {
                    notification.className = 'notification';
                }, 3000);
            }

            fetchDeviceInfo();
        });
    </script>
</body>
</html>
