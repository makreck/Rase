<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASE Firmware Uploader</title>
    <style>
        :root {
            --bg-gradient-0: #01050a;
            --bg-gradient-1: #0b1e42;
            --bg-gradient-2: #0c1830;
            --bg-gradient-3: #071f42;
            --bar-gradient-0: #00b09b;
            --bar-gradient-1: #96c93d;
            --btn-gradient-0: #00805e;
            --btn-gradient-1: #006080;
            --btn-text: #ffffff;
            --btn-text-disabled: #313131;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-card-title: #02cc5d;
            --accent-color: #00d2ff;
            --text-shadow: rgba(0, 0, 0, 0.3);
            --box_shadow: rgba(0, 0, 0, 0.5);
            --font-arial: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono-1: 'Courier New', Courier, monospace;
            --font-serif-1: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-serif-1);
        }

        body {
            font-family: var(--font-arial);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(-45deg, var(--bg-gradient-0), var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3));
            background-size: 400% 400%;
            padding: 20px;
        }

        .container {
            max-width: 2400px;
            margin: 0 auto;
            background: linear-gradient(135deg, #0e3063, #0b2041, #0e3063);
            border-radius: 15px;
            box-shadow: 0 10px 30px var(--box-shadow);
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 15px;
            background: rgba(5, 26, 66, 0.8);
            border-radius: 15px;
            box-shadow: 0 8px 32px var(--box-shadow);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--text-card-title);
            text-shadow: 0 2px 10px var(--box-shadow);
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 500;
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            color: var(--text-card-title);
            align-items: center;
        }

        .card-title i {
            font-size: 1.8rem;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px var(--box-shadow);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-value {
            font-family: var(--font-mono);
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--text-primary);
        }

        .card-unit {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-left: 5px;
        }

        .card-stats {
            display: flex;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .icon-box {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-right: 12px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(to right, var(--btn-gradient-0), var(--btn-gradient-1));
            color: var(--btn-text);
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
            margin: 10px 5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px var(--box-shadow);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:disabled {
            background: #555;
            color: var(--btn-text-disabled);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            border: none;
            background: rgba(0, 42, 97, 0.25);
            color: rgb(241, 242, 245);
            font-size: 1rem;
        }

        input:focus,
        select:focus {
            outline: 2px solid var(--text-card-title);
            background: rgba(1, 62, 119, 0.9);
        }

        .password-field {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-card-title);
        }

        .status {
            text-align: center;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            display: none;
        }

        .progress-container {
            margin-top: 20px;
            display: none;
        }

        .progress-bar {
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: linear-gradient(to right, var(--bar-gradient-0), var(--bar-gradient-1));
            width: 0%;
            transition: width 0.4s ease;
        }

        .success {
            background: rgba(6, 214, 160, 0.2);
            border: 1px solid #06d6a0;
            color: #06d6a0;
            display: block;
        }

        .error {
            background: rgba(239, 71, 111, 0.2);
            border: 1px solid #ef476f;
            color: #ef476f;
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid rgba(13, 3, 59, 0.3);
            border-radius: 50%;
            border-top: 4px solid var(--text-card-title);
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            opacity: 0.7;
            border-top: 1px solid rgba(182, 6, 6, 0.1);
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }





        .upload-area {
            border: 3px dashed rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }

        .upload-area:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .upload-area i {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
        }

        .file-input {
            display: none;
        }

        .device-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .info-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
        }

        .info-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .device-id {
            font-size: 1.8rem;
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            word-break: break-all;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: translateX(200%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
            }

            .config-container {
                padding: 15px;
            }

            h1 {
                font-size: 2rem;
            }

            .btn-container {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 80%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>RASE Firmware Uploader</h1>
            <p class="subtitle">Securely update firmware on your devices</p>
        </header>

        <div class="card">
            <h2 class="card-title">Device Information</h2>
            <div class="device-id" id="deviceId">Retrieving device ID...</div>

            <div class="device-info" id="deviceInfo">
                <!-- Device info will be populated here -->
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">Firmware Update</h2>
            <p>Select a firmware image file to upload:</p>

            <div class="upload-area" id="dropArea">
                <i>📁</i>
                <p>Drag & drop your firmware file here</p>
                <p>or</p>
                <button class="btn" id="browseBtn">Browse Files</button>
                <input type="file" id="fileInput" class="file-input" accept=".bin,.hex,.img">
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="status" id="status">Uploading firmware...</div>
            </div>

            <div class="btn-container">
                <button class="btn" id="uploadBtn" disabled>Upload Firmware</button>
                <button class="btn" id="refreshBtn">Refresh Device Info</button>
            </div>
        </div>
        <footer>
            <p>RASE Update Manager &copy; 2026</p>
        </footer>
    </div>

    <div class="notification" id="notification"></div>


    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const dropArea = document.getElementById('dropArea');
            const fileInput = document.getElementById('fileInput');
            const browseBtn = document.getElementById('browseBtn');
            const uploadBtn = document.getElementById('uploadBtn');
            const refreshBtn = document.getElementById('refreshBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progress');
            const statusMessage = document.getElementById('status');
            const deviceId = document.getElementById('deviceId');
            const deviceInfo = document.getElementById('deviceInfo');
            const notification = document.getElementById('notification');

            let selectedFile = null;

            browseBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleFileSelect);
            uploadBtn.addEventListener('click', uploadFirmware);
            refreshBtn.addEventListener('click', fetchDeviceInfo);

            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, highlight, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, unhighlight, false);
            });

            function highlight() {
                dropArea.style.backgroundColor = 'rgba(255, 255, 255, 0.15)';
                dropArea.style.borderColor = 'rgba(255, 255, 255, 0.7)';
            }

            function unhighlight() {
                dropArea.style.backgroundColor = '';
                dropArea.style.borderColor = 'rgba(255, 255, 255, 0.3)';
            }

            dropArea.addEventListener('drop', handleDrop, false);

            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;
                if (files.length) {
                    handleFiles(files);
                }
            }

            function handleFileSelect(e) {
                const files = e.target.files;
                if (files.length) {
                    handleFiles(files);
                }
            }

            function handleFiles(files) {
                selectedFile = files[0];
                if (selectedFile.type !== 'application/octet-stream' && !selectedFile.name.endsWith('.bin')) {
                    showNotification('Please select a valid firmware file (.bin)', 'error');
                    return;
                }

                uploadBtn.disabled = false;
                statusMessage.textContent = `Selected: ${selectedFile.name} (${formatFileSize(selectedFile.size)})`;
            }

            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            function fetchDeviceInfo() {
                showNotification('Fetching device information...', 'info');
                fetch('/api/id', { method: 'GET' })
                    .then(response => response.json())
                    .then(data => {
                        displayDeviceInfo(data);
                        showNotification('Device information retrieved successfully', 'success');
                    })
                    .catch(error => {
                        console.error('Error fetching device info:', error);
                        showNotification('Failed to retrieve device information', 'error');
                    });
            }

            function displayDeviceInfo(data) {
                deviceId.textContent = data.identification;

                deviceInfo.innerHTML = '';

                Object.entries(data).forEach(([key, value]) => {
                    const item = document.createElement('div');
                    item.className = 'info-item';

                    const label = document.createElement('div');
                    label.className = 'info-label';
                    label.textContent = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());

                    const valueEl = document.createElement('div');
                    valueEl.className = 'info-value';
                    valueEl.textContent = value;

                    item.appendChild(label);
                    item.appendChild(valueEl);
                    deviceInfo.appendChild(item);
                });
            }

            function uploadFirmware() {
                if (!selectedFile) {
                    statusMessage.className = 'status error';
                    statusMessage.textContent = 'Please select a firmware file first';
                    statusMessage.style.display = 'block';
                    return;
                }

                progressContainer.style.display = 'block';
                progressBar.style.width = '0%';
                statusMessage.className = 'status info';
                statusMessage.textContent = 'Starting upload...';
                statusMessage.style.display = 'block';

                const formData = new FormData();
                formData.append('firmware', selectedFile);

                const xhr = new XMLHttpRequest();

                xhr.upload.addEventListener('progress', function (e) {
                    if (e.lengthComputable) {
                        const percentComplete = (e.loaded / e.total) * 100;
                        progressBar.style.width = percentComplete + '%';
                    }
                });

                xhr.addEventListener('load', function () {
                    if (xhr.status === 200) {
                        statusMessage.className = 'status success';
                        statusMessage.textContent = 'Firmware uploaded successfully!';
                        setTimeout(() => {
                            progressContainer.style.display = 'none';
                            fileName.textContent = 'No file selected';
                            uploadBtn.disabled = true;
                            selectedFile = null;
                        }, 2000);
                    } else {
                        statusMessage.className = 'status error';
                        statusMessage.textContent = 'Upload failed: ' + xhr.statusText;
                    }
                });

                xhr.addEventListener('error', function () {
                    statusMessage.className = 'status error';
                    statusMessage.textContent = 'Upload failed due to network error';
                    progressContainer.style.display = 'none';
                });

                xhr.open('PUT', '/api/update');
                xhr.setRequestHeader('Content-Type', 'application/octet-stream');

                const reader = new FileReader();
                reader.onload = function () {
                    const arrayBuffer = reader.result;
                    xhr.send(arrayBuffer);
                };
                reader.readAsArrayBuffer(selectedFile);
            }

            function showNotification(message, type) {
                notification.textContent = message;
                notification.className = 'notification ' + type;

                setTimeout(() => {
                    notification.className = 'notification';
                }, 3000);
            }

            fetchDeviceInfo();
        });
    </script>
</body>

</html>
